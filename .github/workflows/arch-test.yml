name: Test MNCM Labs on Arch Linux

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mncm-arch-${{ github.ref }}
  cancel-in-progress: true

jobs:

  arch-test:

    name: Arch Linux container test

    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:

      - name: Install CI dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git \
            bash \
            sudo \
            rsync \
            grep \
            findutils \
            coreutils \
            python

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create non-root MNCM test user
        run: |
          useradd \
            --create-home \
            --shell /bin/bash \
            mncm-ci

          echo "mncm-ci ALL=(ALL) NOPASSWD: ALL" \
            > /etc/sudoers.d/mncm-ci

          chmod 440 /etc/sudoers.d/mncm-ci

          chown -R mncm-ci:mncm-ci "$GITHUB_WORKSPACE"

          id mncm-ci

      - name: Repository validation
        run: |
          ./tests/check.sh

      - name: Verify root protection
        run: |
          set +e

          ./scripts/install.sh \
            --profile minimal \
            --no-dotfiles \
            > /tmp/mncm-root-test.log 2>&1

          STATUS=$?

          set -e

          cat /tmp/mncm-root-test.log

          if [ "$STATUS" -eq 0 ]; then
            echo "ERROR: Installer unexpectedly allowed root execution."
            exit 1
          fi

          grep -q \
            "Do not run the installer directly as root" \
            /tmp/mncm-root-test.log

          echo "✓ Installer correctly blocks direct root execution"

      - name: Run Arch Linux tests as regular user
        run: |
          sudo -u mncm-ci \
            env \
              HOME=/home/mncm-ci \
              USER=mncm-ci \
              LOGNAME=mncm-ci \
              CI=true \
              GITHUB_ACTIONS=true \
              GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -lc \
              'cd "$GITHUB_WORKSPACE" && ./tests/arch-container.sh'
