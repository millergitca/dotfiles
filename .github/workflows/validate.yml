name: Validate MNCM Labs

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mncm-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck python3

      - name: Run MNCM Labs validation
        run: |
          ./tests/check.sh

      - name: Validate installer help
        run: |
          ./scripts/install.sh --help >/dev/null
          ./scripts/install.sh --version

      - name: Validate dotfile CLI
        run: |
          ./scripts/dotfiles.sh --help >/dev/null
          ./scripts/dotfiles.sh --version

      - name: Validate release readiness
        run: |
          ./scripts/release-check.sh
